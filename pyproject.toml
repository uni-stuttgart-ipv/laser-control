[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laser-control"
dynamic = ["version"]  # single source: __version__ in src/laser_control/__init__.py
description = "Desktop app to control a serial laser: camera and manual modes, power, on/off."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "coherent-cube",
  "pyserial>=3.5,<4",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.gui-scripts]
laser-control = "laser_control.__main__:main"

[tool.hatch.version]
path = "src/laser_control/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/laser_control"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rs"   # list every skipped test with its reason
